# CI of the kit. GitHub-hosted runners only (public repository).
# - gate: type-check, lint (ESLint, no-product-refs, dist matches the sources), unit tests.
# - e2e: the real-browser self-tests against each fixture app (README "Release checklist":
#   every job must be green before a v* tag).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  FLUTTER_VERSION: '3.47.8'
  # Compose fixture: JDK for Gradle (the Gradle, Kotlin and Compose versions are pinned in the app).
  JAVA_VERSION: '21'

jobs:
  gate:
    name: gate (type-check, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check:no-product-refs --history scans all commit and tag messages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  e2e:
    name: e2e (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [react, vue, angular, flutter, compose]
    env:
      E2E_APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures-apps/*/package-lock.json
      - if: matrix.app == 'flutter'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: matrix.app == 'compose'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            test/fixtures-apps/compose/*.gradle.kts
            test/fixtures-apps/compose/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Installs and builds the fixture app outside the Playwright web-server timeout.
      - run: node e2e/prepare-app.mjs ${{ matrix.app }}
      - run: npm run test:e2e
        env:
          E2E_PREBUILT: '1'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.app }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
